<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roity — Projeto Tony Cozendey</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --gold:#C9A96E;--gold2:#e8c98a;--gold-dim:#7a6340;
  --navy:#0E1C50;--navy2:#16255E;
  --bg:#05070f;--bg2:#090d1c;--bg3:#0d1225;--bg4:#111830;
  --glass:rgba(255,255,255,0.035);--glass-b:rgba(255,255,255,0.08);
  --glass-gold:rgba(201,169,110,0.12);--glass-gold-b:rgba(201,169,110,0.22);
  --text:#ede9dc;--text2:#9a9178;--text3:#4e4a3e;
  --danger:#c0392b;--danger2:#e74c3c;--danger-bg:rgba(192,57,43,0.1);--danger-b:rgba(192,57,43,0.25);
  --success:#1a7a40;--success2:#27ae60;--success-bg:rgba(26,122,64,0.1);--success-b:rgba(39,174,96,0.25);
  --warn:#b7580a;--warn2:#e67e22;--warn-bg:rgba(183,88,10,0.1);--warn-b:rgba(230,126,34,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* SPINNER */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:400;}
#loading p{font-size:11px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;}
.spinner{width:28px;height:28px;border:2px solid rgba(201,169,110,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* LOGIN */
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:2rem;padding:2rem;position:relative;overflow:hidden;}
.login-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 25%,rgba(14,28,80,0.55) 0%,transparent 55%),radial-gradient(ellipse at 80% 80%,rgba(201,169,110,0.07) 0%,transparent 50%);}
.login-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2rem;width:100%;max-width:360px;}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:10px;}
.login-logo img{height:60px;width:auto;max-width:260px;object-fit:contain;filter:invert(1) sepia(1) saturate(1.5) hue-rotate(5deg) brightness(1.1);}
.login-logo-name{font-size:18px;font-weight:800;color:var(--text);letter-spacing:4px;}
.login-logo-sub{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;}
.login-box{width:100%;background:rgba(9,13,28,0.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-b);border-radius:20px;padding:2rem;display:flex;flex-direction:column;gap:1rem;}
.login-box h2{font-size:14px;font-weight:600;color:var(--text2);text-align:center;letter-spacing:.5px;}
.field-group{display:flex;flex-direction:column;gap:5px;}
.field-group label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;}
.field-wrap{position:relative;display:flex;align-items:center;}
.field-wrap input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--glass-b);border-radius:10px;padding:11px 40px 11px 14px;font-size:13px;color:var(--text);font-family:inherit;transition:border-color .15s;}
.field-wrap input:focus{outline:none;border-color:var(--gold);}
.field-wrap input::placeholder{color:var(--text3);}
.eye-btn{position:absolute;right:11px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px;transition:color .1s;display:flex;align-items:center;}
.eye-btn:hover{color:var(--gold);}
.login-btn{background:linear-gradient(135deg,var(--gold) 0%,#9a7030 100%);border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;color:#05070f;cursor:pointer;transition:opacity .15s;letter-spacing:.3px;margin-top:4px;}
.login-btn:hover{opacity:.87;}
.login-error{font-size:12px;color:var(--danger2);text-align:center;display:none;padding:8px 12px;background:var(--danger-bg);border:1px solid var(--danger-b);border-radius:8px;}

/* APP SHELL */
#app{display:none;min-height:100vh;flex-direction:column;}
.topbar{background:rgba(5,7,15,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-b);padding:.7rem 1.25rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.topbar-logo{height:28px;width:auto;max-width:120px;object-fit:contain;filter:invert(1) sepia(1) saturate(1.5) hue-rotate(5deg) brightness(1.1);}
.topbar-name{font-size:13px;font-weight:800;color:var(--text);letter-spacing:2px;}
.topbar-project{font-size:10px;color:var(--text3);letter-spacing:.3px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.sync-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);background:var(--glass);border:1px solid var(--glass-b);padding:4px 10px;border-radius:20px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--success2);}
.sync-dot.syncing{background:var(--gold);animation:blink .8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.user-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text);background:var(--glass);border:1px solid var(--glass-b);padding:4px 11px;border-radius:20px;}
.user-pill i{color:var(--gold);font-size:13px;}
.logout-btn{background:none;border:1px solid var(--glass-b);border-radius:8px;color:var(--text3);font-size:11px;padding:5px 11px;cursor:pointer;transition:all .1s;}
.logout-btn:hover{border-color:var(--gold);color:var(--gold);}

/* NAV TABS */
.nav-tabs{background:rgba(5,7,15,0.7);backdrop-filter:blur(12px);border-bottom:1px solid var(--glass-b);padding:0 1.25rem;display:flex;gap:0;}
.nav-tab{background:none;border:none;border-bottom:2px solid transparent;padding:.65rem 1.1rem;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;letter-spacing:.3px;font-family:inherit;}
.nav-tab:hover{color:var(--text2);}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.nav-tab i{font-size:14px;}

/* SCHEDULE ALERT BANNER */
#schedule-banner{display:none;background:linear-gradient(90deg,rgba(192,57,43,0.18) 0%,rgba(192,57,43,0.08) 100%);border-bottom:1px solid var(--danger-b);padding:.6rem 1.25rem;align-items:center;gap:10px;font-size:12px;color:#e88;animation:pulse-bg 2s infinite;}
@keyframes pulse-bg{0%,100%{background:linear-gradient(90deg,rgba(192,57,43,0.18) 0%,rgba(192,57,43,0.08) 100%);}50%{background:linear-gradient(90deg,rgba(192,57,43,0.28) 0%,rgba(192,57,43,0.12) 100%);}}
#schedule-banner i{font-size:16px;color:var(--danger2);flex-shrink:0;}
#schedule-banner span{flex:1;}
#schedule-banner.ok{display:flex!important;background:linear-gradient(90deg,rgba(26,122,64,0.18) 0%,rgba(26,122,64,0.06) 100%);border-bottom-color:var(--success-b);color:#7dcea0;animation:none;}
#schedule-banner.ok i{color:var(--success2);}

/* VIEWS */
.view{display:none;flex:1;}
.view.active{display:block;}

/* ── DASHBOARD VIEW ── */
#view-dashboard{padding:1.25rem;}
.dash-greeting{margin-bottom:1.5rem;}
.dash-greeting h2{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px;}
.dash-greeting h2 span{color:var(--gold);}
.dash-greeting p{font-size:13px;color:var(--text2);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:1.25rem;}
.kpi-card{background:var(--bg2);border:1px solid var(--glass-b);border-radius:14px;padding:1rem 1.1rem;}
.kpi-card.gold-border{border-color:var(--glass-gold-b);}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.kpi-label i{font-size:13px;}
.kpi-value{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
.kpi-value.gold{color:var(--gold);}
.kpi-value.green{color:var(--success2);}
.kpi-value.red{color:var(--danger2);}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:5px;}

.dash-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem;}
@media(max-width:640px){.dash-row{grid-template-columns:1fr;}}

.dash-card{background:var(--bg2);border:1px solid var(--glass-b);border-radius:14px;padding:1rem 1.1rem;}
.dash-card-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.75rem;display:flex;align-items:center;gap:6px;}
.dash-card-title i{font-size:14px;color:var(--gold);}

.editor-status-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--glass-b);}
.editor-status-row:last-child{border-bottom:none;}
.editor-status-name{font-size:13px;font-weight:600;color:var(--text);}
.editor-status-role{font-size:10px;color:var(--text3);}
.status-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:6px;display:flex;align-items:center;gap:4px;}
.status-badge.ok{background:var(--success-bg);border:1px solid var(--success-b);color:var(--success2);}
.status-badge.late{background:var(--danger-bg);border:1px solid var(--danger-b);color:var(--danger2);}
.status-badge.warn{background:var(--warn-bg);border:1px solid var(--warn-b);color:var(--warn2);}

.week-dots{display:flex;gap:5px;flex-wrap:wrap;}
.week-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:default;}
.week-dot.ok{background:var(--success-bg);border:1px solid var(--success-b);color:var(--success2);}
.week-dot.fail{background:var(--danger-bg);border:1px solid var(--danger-b);color:var(--danger2);}
.week-dot.partial{background:var(--warn-bg);border:1px solid var(--warn-b);color:var(--warn2);}
.week-dot.pending{background:var(--glass);border:1px solid var(--glass-b);color:var(--text3);}
.week-dot.today{border-color:var(--gold);color:var(--gold);}

.plat-sched-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--glass-b);}
.plat-sched-row:last-child{border-bottom:none;}
.plat-sched-name{font-size:12px;color:var(--text);display:flex;align-items:center;gap:6px;}
.plat-sched-name i{font-size:14px;color:var(--text2);}

/* ── KANBAN VIEW ── */
#view-kanban{}
.week-nav{background:rgba(5,7,15,0.6);backdrop-filter:blur(10px);border-bottom:1px solid var(--glass-b);padding:.55rem 1.25rem;display:flex;align-items:center;gap:12px;}
.nav-btn{background:var(--glass);border:1px solid var(--glass-b);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--text2);transition:all .1s;}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.week-label{font-size:12px;font-weight:700;color:var(--text);flex:1;text-align:center;letter-spacing:.3px;}
.days-grid{padding:1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}

.day-card{background:var(--bg2);border:1px solid var(--glass-b);border-radius:16px;overflow:hidden;transition:all .2s;}
.day-card:hover{border-color:var(--glass-gold-b);box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.day-card.today{border-color:rgba(201,169,110,0.4);}
.day-card.sched-alert-card{border-color:var(--danger-b);animation:pulse-card 2s infinite;}
@keyframes pulse-card{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.15);}50%{box-shadow:0 0 0 5px rgba(192,57,43,0.04);}}

.day-header{padding:9px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--glass-b);background:rgba(255,255,255,0.018);}
.day-card.today .day-header{background:rgba(14,28,80,0.45);}
.day-title{font-size:12px;font-weight:700;color:var(--text);letter-spacing:.3px;}
.day-badges{display:flex;align-items:center;gap:5px;}
.badge-today{background:var(--gold);color:#05070f;font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;}
.sdot{width:7px;height:7px;border-radius:50%;}
.sdot-g{background:var(--success2);}
.sdot-r{background:var(--danger2);}
.sdot-o{background:var(--warn2);}
.sdot-gray{background:var(--text3);}

.day-body{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.hist-bar{border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px;}
.hb-fail{background:var(--danger-bg);color:var(--danger2);border:1px solid var(--danger-b);}
.hb-partial{background:var(--warn-bg);color:var(--warn2);border:1px solid var(--warn-b);}
.hb-ok{background:var(--success-bg);color:var(--success2);border:1px solid var(--success-b);}

.editor-block{background:rgba(255,255,255,0.022);border:1px solid var(--glass-b);border-radius:11px;padding:9px 11px;}
.editor-label{font-size:10px;font-weight:700;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.editor-label i{font-size:13px;color:var(--gold);}
.link-row{display:flex;gap:5px;align-items:center;}
.link-input{flex:1;font-size:11px;padding:7px 10px;border:1px solid var(--glass-b);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text);min-width:0;font-family:inherit;transition:border-color .15s;}
.link-input:focus{outline:none;border-color:var(--gold);}
.link-input::placeholder{color:var(--text3);}
.open-btn{background:rgba(201,169,110,0.1);border:1px solid var(--glass-gold-b);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--gold);font-size:14px;transition:all .12s;flex-shrink:0;}
.open-btn:hover{background:rgba(201,169,110,0.2);}
.obs-area{width:100%;font-size:12px;padding:8px 10px;border:1px solid var(--glass-b);border-radius:8px;background:rgba(255,255,255,0.04);color:var(--text);resize:vertical;font-family:inherit;transition:border-color .15s;margin-top:6px;min-height:80px;line-height:1.6;}
.obs-area:focus{outline:none;border-color:var(--gold);}
.obs-area::placeholder{color:var(--text3);}
.obs-notify{background:var(--glass-gold);border:1px solid var(--glass-gold-b);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--gold);margin-top:6px;display:flex;align-items:flex-start;gap:7px;line-height:1.5;}
.obs-notify i{flex-shrink:0;margin-top:1px;font-size:14px;}

.post-section{}
.post-label{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;}
.post-label.warn{color:var(--warn2);}
.plat-row{display:flex;gap:5px;flex-wrap:wrap;}
.plat-btn{font-size:10px;border:1px solid var(--glass-b);border-radius:8px;padding:5px 11px;cursor:pointer;background:rgba(255,255,255,0.04);color:var(--text2);transition:all .1s;display:flex;align-items:center;gap:4px;font-family:inherit;font-weight:600;}
.plat-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.plat-btn.done{background:var(--success-bg);border-color:var(--success-b);color:var(--success2);}
.plat-btn:disabled{opacity:.35;cursor:not-allowed;}
.complete-strip{background:var(--success-bg);border:1px solid var(--success-b);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--success2);display:flex;align-items:center;gap:5px;font-weight:600;}
.sched-strip{background:var(--danger-bg);border:1px solid var(--danger-b);border-radius:8px;padding:6px 9px;font-size:11px;color:var(--danger2);display:flex;align-items:center;gap:6px;font-weight:600;}

/* LEGEND */
.legend{background:rgba(5,7,15,0.6);backdrop-filter:blur(10px);border-top:1px solid var(--glass-b);padding:.6rem 1.25rem;display:flex;gap:14px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}

/* POPUP OVERLAY */
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:1.5rem;}
.popup-overlay.visible{display:flex;}
.popup-box{background:rgba(9,13,28,0.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--glass-gold-b);border-radius:22px;padding:2rem 2rem 1.75rem;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1.1rem;position:relative;}
.popup-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;transition:color .1s;padding:4px;}
.popup-close:hover{color:var(--text);}
.popup-logo{height:44px;width:auto;max-width:180px;object-fit:contain;filter:invert(1) sepia(1) saturate(1.5) hue-rotate(5deg) brightness(1.1);}
.popup-time{font-size:10px;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;font-weight:700;}
.popup-title{font-size:24px;font-weight:800;color:var(--text);text-align:center;line-height:1.2;}
.popup-title span{color:var(--gold);}
.popup-quote{font-size:13px;color:var(--text2);text-align:left;line-height:1.8;font-style:italic;border-left:2px solid var(--gold-dim);padding-left:14px;width:100%;}
.popup-enter{background:linear-gradient(135deg,var(--gold) 0%,#9a7030 100%);border:none;border-radius:11px;padding:12px 32px;font-size:13px;font-weight:700;color:#05070f;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;gap:8px;width:100%;justify-content:center;}
.popup-enter:hover{opacity:.87;}

/* EDITOR POPUP */
.editor-popup-box{background:rgba(9,13,28,0.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px;padding:2rem;max-width:400px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1rem;position:relative;}
.editor-popup-box.danger{border:1px solid var(--danger-b);}
.editor-popup-box.success{border:1px solid var(--success-b);}
.ep-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;}
.ep-icon.danger{background:var(--danger-bg);border:1px solid var(--danger-b);color:var(--danger2);}
.ep-icon.success{background:var(--success-bg);border:1px solid var(--success-b);color:var(--success2);}
.ep-title{font-size:18px;font-weight:800;color:var(--text);text-align:center;}
.ep-body{font-size:13px;color:var(--text2);text-align:center;line-height:1.7;}
.ep-body strong{color:var(--text);}
.ep-btn{border:none;border-radius:10px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;}
.ep-btn.danger{background:linear-gradient(135deg,var(--danger2),var(--danger));color:#fff;}
.ep-btn.success{background:linear-gradient(135deg,var(--success2),var(--success));color:#fff;}
.ep-btn:hover{opacity:.87;}

@media(max-width:600px){
  .days-grid{grid-template-columns:1fr;padding:.75rem;}
  .topbar{padding:.6rem 1rem;}
  .topbar-project,.sync-pill{display:none;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Carregando...</p></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-bg"></div>

function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtDate(d){return d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function getWeekStart(d){const r=new Date(d);r.setHours(0,0,0,0);const dy=r.getDay();r.setDate(r.getDate()-(dy===0?6:dy-1));return r;}
function getGreeting(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}

function setSyncing(on){
  const dot=document.getElementById('sync-dot'),lbl=document.getElementById('sync-label');
  if(!dot)return;
  if(on){dot.classList.add('syncing');lbl.textContent='Salvando...';}
  else{dot.classList.remove('syncing');lbl.textContent='Sincronizado';}
}

function togglePass(){
  const inp=document.getElementById('inp-pass'),icon=document.getElementById('eye-icon');
  if(inp.type==='password'){inp.type='text';icon.className='ti ti-eye-off';}
  else{inp.type='password';icon.className='ti ti-eye';}
}

function doLogin(){
  const user=document.getElementById('inp-user').value.trim().toLowerCase();
  const pass=document.getElementById('inp-pass').value;
  const err=document.getElementById('login-error');
  if(!USERS[user]||USERS[user].pass!==pass){err.style.display='block';return;}
  err.style.display='none';
  currentUser={id:user,...USERS[user]};
  startApp();
}

async function startApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('loading').style.display='flex';
  document.getElementById('user-label').textContent=currentUser.name+(currentUser.role==='admin'?' (Admin)':'');
  currentWeekStart=getWeekStart(new Date());
  await loadWeek(currentWeekStart);
  await loadExtraForDash();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';

  if(currentUser.role==='admin'){
    document.getElementById('nav-tabs').style.display='flex';
    switchTab('dashboard');
  } else {
    document.getElementById('nav-tabs').style.display='none';
    switchTab('kanban');
  }

  updateScheduleBanner();
  showWelcomePopup();
  if(currentUser.role==='editor') showEditorPopup();
  // Realtime: escuta mudanças de outros dispositivos
  sb.channel('dashboard-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'tony_dashboard'},
      async (payload)=>{
        const row=payload.new||payload.old;
        if(row&&row.day_key){cache[row.day_key]=row;}
        updateScheduleBanner();
        if(currentUser.role==='admin'){renderDashboard();renderKanban();}
        else renderKanban();
      })
    .subscribe();
}

function showWelcomePopup(){
  document.getElementById('popup-time').textContent=getGreeting()+' • '+new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  document.getElementById('popup-name').textContent=currentUser.name+'!';
  document.getElementById('popup-quote').textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('welcome-popup').classList.add('visible');
}
function closeWelcome(){document.getElementById('welcome-popup').classList.remove('visible');}

function showEditorPopup(){
  const today=new Date();today.setHours(0,0,0,0);
  const checks=[today,addDays(today,1),addDays(today,2)];
  const missing=checks.filter(d=>{const k=dateKey(d);const r=cache[k];return !r||(!r.long_link&&!r.viral_link);});
  const box=document.getElementById('editor-popup-box');
  const icon=document.getElementById('ep-icon');
  const title=document.getElementById('ep-title');
  const body=document.getElementById('ep-body');
  const btn=document.getElementById('ep-btn');
  if(missing.length>=2){
    box.className='editor-popup-box danger';
    icon.className='ep-icon danger';icon.innerHTML='<i class="ti ti-alert-triangle"></i>';
    title.textContent='Você está em atraso!';
    body.innerHTML='Você tem <strong>'+missing.length+' dia(s)</strong> sem links nos próximos 2 dias.<br><br>Suba os links do Drive agora para manter a produção em dia.';
    btn.className='ep-btn danger';
  } else {
    box.className='editor-popup-box success';
    icon.className='ep-icon success';icon.innerHTML='<i class="ti ti-circle-check"></i>';
    title.textContent='Você está em dia!';
    body.innerHTML='Links dos próximos dias enviados. <strong>Excelente!</strong><br><br>Continue sempre 2 dias adiantado.';
    btn.className='ep-btn success';
  }
  document.getElementById('editor-popup').classList.add('visible');
}
function closeEditorPopup(){document.getElementById('editor-popup').classList.remove('visible');}

function logout(){
  currentUser=null;cache={};
  document.getElementById('app').style.display='none';
  document.getElementById('inp-user').value='';document.getElementById('inp-pass').value='';
  document.getElementById('login-screen').style.display='flex';
}

async function loadWeek(ws){
  const keys=[];
  for(let i=0;i<7;i++){const d=addDays(ws,i);if(d>=PROJECT_START)keys.push(dateKey(d));}
  const{data}=await sb.from('tony_dashboard').select('*').in('day_key',keys);
  if(data)data.forEach(r=>{cache[r.day_key]=r;});
}

async function loadExtraForDash(){
  const today=new Date();today.setHours(0,0,0,0);
  const keys=[];
  for(let i=-14;i<=3;i++){const d=addDays(today,i);if(d>=PROJECT_START)keys.push(dateKey(d));}
  const{data}=await sb.from('tony_dashboard').select('*').in('day_key',keys);
  if(data)data.forEach(r=>{cache[r.day_key]=r;});
}

function getDay(key){
  if(!cache[key])cache[key]={day_key:key,long_link:'',viral_link:'',long_obs:'',viral_obs:'',platforms:{}};
  return cache[key];
}

async function upsertDay(key){
  setSyncing(true);
  const d=getDay(key);
  await sb.from('tony_dashboard').upsert({
    day_key:key,long_link:d.long_link||'',viral_link:d.viral_link||'',
    long_obs:d.long_obs||'',viral_obs:d.viral_obs||'',
    platforms:d.platforms||{},updated_at:new Date().toISOString()
  },{onConflict:'day_key'});
  setSyncing(false);
  updateScheduleBanner();
  if(currentUser.role==='admin'){
    renderDashboard();
    renderKanban();
  }
}

function scheduleSave(key){
  if(saveTimers[key])clearTimeout(saveTimers[key]);
  saveTimers[key]=setTimeout(()=>upsertDay(key),900);
}
function saveField(key,field,val){getDay(key)[field]=val;scheduleSave(key);}

function isDayComplete(key){
  const d=cache[key];
  if(!d||!d.long_link||!d.viral_link)return false;
  return PLATFORMS.every(p=>d.platforms&&d.platforms[p]==='done');
}
function hasLinks(key){const d=cache[key];return !!(d&&d.long_link&&d.viral_link);}

async function togglePlat(key,plat){
  if(currentUser.role!=='admin'||!hasLinks(key))return;
  const d=getDay(key);
  if(!d.platforms)d.platforms={};
  d.platforms[plat]=d.platforms[plat]==='done'?'':'done';
  await upsertDay(key);
  renderKanban();
}

function updateScheduleBanner(){
  const banner=document.getElementById('schedule-banner');
  const today=new Date();today.setHours(0,0,0,0);
  const tomorrow=addDays(today,1);
  const tKey=dateKey(tomorrow);
  const d=cache[tKey];
  const allDone=d&&PLATFORMS.every(p=>d.platforms&&d.platforms[p]==='done');
  if(allDone){
    banner.style.display='flex';
    banner.className='ok';
    document.getElementById('banner-icon').className='ti ti-circle-check';
    document.getElementById('banner-text').textContent='Postagens de amanhã agendadas nas 3 plataformas. Tudo certo!';
  } else {
    banner.style.display='flex';
    banner.className='';
    document.getElementById('banner-icon').className='ti ti-alert-triangle';
    document.getElementById('banner-text').textContent='Postagens de amanhã ainda não foram agendadas em todas as plataformas. Regularize!';
  }
}

function switchTab(tab){
  document.getElementById('tab-dash').classList.toggle('active',tab==='dashboard');
  document.getElementById('tab-kanban').classList.toggle('active',tab==='kanban');
  document.getElementById('view-dashboard').classList.toggle('active',tab==='dashboard');
  document.getElementById('view-kanban').classList.toggle('active',tab==='kanban');
  if(tab==='dashboard')renderDashboard();
  if(tab==='kanban')renderKanban();
}

function renderDashboard(){
  const today=new Date();today.setHours(0,0,0,0);
  const todayKey=dateKey(today);
  const tomorrowKey=dateKey(addDays(today,1));

  // KPIs
  let totalDays=0,completeDays=0,failDays=0,partialDays=0;
  const d=new Date(PROJECT_START);
  while(d<=today){
    const k=dateKey(d);
    const hist=HISTORY[k];
    const live=cache[k];
    totalDays++;
    if(hist){
      if(hist.status==='ok')completeDays++;
      else if(hist.status==='fail')failDays++;
      else if(hist.status==='partial')partialDays++;
    } else if(live&&isDayComplete(k)){completeDays++;}
    d.setDate(d.getDate()+1);
  }

  // Editor status
  function editorStatus(field){
    const checks=[today,addDays(today,1),addDays(today,2)];
    const missing=checks.filter(dt=>{const k=dateKey(dt);const r=cache[k];return !r||!r[field];});
    if(missing.length===0)return 'ok';
    if(missing.length<=1)return 'warn';
    return 'late';
  }
  const rudneyS=editorStatus('long_link');
  const teixeiraS=editorStatus('viral_link');

  // Tomorrow schedule
  const tmr=cache[tomorrowKey];
  const platStatus=PLATFORMS.map(p=>({p,done:!!(tmr&&tmr.platforms&&tmr.platforms[p]==='done')}));
  const allSched=platStatus.every(x=>x.done);

  // Recent history dots
  const recentDays=[];
  for(let i=9;i>=0;i--){
    const dt=addDays(today,-i);
    if(dt<PROJECT_START)continue;
    const k=dateKey(dt);
    const hist=HISTORY[k];
    const live=cache[k];
    let st='pending';
    if(hist)st=hist.status;
    else if(live&&isDayComplete(k))st='ok';
    else if(live&&(live.long_link||live.viral_link))st='partial';
    recentDays.push({k,dt,st});
  }

  const statusBadge=(s)=>{
    if(s==='ok')return '<span class="status-badge ok"><i class="ti ti-check"></i>Em dia</span>';
    if(s==='warn')return '<span class="status-badge warn"><i class="ti ti-clock"></i>1 dia faltando</span>';
    return '<span class="status-badge late"><i class="ti ti-alert-triangle"></i>Atrasado</span>';
  };

  const dotClass=(s)=>{
    if(s==='ok')return 'week-dot ok';
    if(s==='fail')return 'week-dot fail';
    if(s==='partial')return 'week-dot partial';
    return 'week-dot pending';
  };

  const pct=totalDays>0?Math.round((completeDays/totalDays)*100):0;

  document.getElementById('view-dashboard-content').innerHTML=`
    <div class="dash-greeting">
      <h2>${getGreeting()}, <span>Gustavo!</span></h2>
      <p>Aqui está o resumo completo do Projeto Tony Cozendey.</p>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card gold-border">
        <div class="kpi-label"><i class="ti ti-calendar-check" style="color:var(--gold);"></i>Dias completos</div>
        <div class="kpi-value gold">${completeDays}</div>
        <div class="kpi-sub">de ${totalDays} dias desde o início</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label"><i class="ti ti-percentage" style="color:var(--gold);"></i>Taxa de sucesso</div>
        <div class="kpi-value ${pct>=70?'green':pct>=40?'':'red'}">${pct}%</div>
        <div class="kpi-sub">dias com tudo concluído</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label"><i class="ti ti-x" style="color:var(--danger2);"></i>Dias falhos</div>
        <div class="kpi-value red">${failDays}</div>
        <div class="kpi-sub">${partialDays} parciais</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label"><i class="ti ti-calendar-event" style="color:var(--gold);"></i>Início do projeto</div>
        <div class="kpi-value" style="font-size:18px;padding-top:4px;">03/08</div>
        <div class="kpi-sub">${totalDays} dias rodando</div>
      </div>
    </div>

    <div class="dash-row">
      <div class="dash-card">
        <div class="dash-card-title"><i class="ti ti-users"></i>Status dos editores</div>
        <div class="editor-status-row">
          <div><div class="editor-status-name">Rudney</div><div class="editor-status-role">Vídeos longos</div></div>
          ${statusBadge(rudneyS)}
        </div>
        <div class="editor-status-row">
          <div><div class="editor-status-name">Teixeira</div><div class="editor-status-role">Cortes virais</div></div>
          ${statusBadge(teixeiraS)}
        </div>
      </div>

      <div class="dash-card">
        <div class="dash-card-title"><i class="ti ti-brand-instagram"></i>Postagens de amanhã</div>
        ${platStatus.map(x=>`
          <div class="plat-sched-row">
            <div class="plat-sched-name"><i class="ti ${PLAT_ICONS[x.p]}"></i>${x.p}</div>
            ${x.done
              ?'<span class="status-badge ok"><i class="ti ti-check"></i>Agendado</span>'
              :'<span class="status-badge late"><i class="ti ti-x"></i>Pendente</span>'}
          </div>`).join('')}
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--glass-b);font-size:11px;color:${allSched?'var(--success2)':'var(--danger2)'};">
          <i class="ti ${allSched?'ti-circle-check':'ti-alert-triangle'}"></i>
          ${allSched?'Tudo agendado para amanhã':'Agende nas plataformas faltantes'}
        </div>
      </div>
    </div>

    <div class="dash-card" style="margin-bottom:1.25rem;">
      <div class="dash-card-title"><i class="ti ti-history"></i>Histórico recente (últimos ${recentDays.length} dias)</div>
      <div class="week-dots">
        ${recentDays.map(x=>`
          <div class="${dotClass(x.st)}${dateKey(today)===x.k?' today':''}" title="${x.dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})} — ${x.st==='ok'?'Completo':x.st==='fail'?'Falhou':x.st==='partial'?'Parcial':'Pendente'}">
            ${x.dt.getDate()}
          </div>`).join('')}
      </div>
    </div>
  `;
}

async function changeWeek(dir){
  currentWeekStart=addDays(currentWeekStart,dir*7);
  document.getElementById('loading').style.display='flex';
  document.getElementById('view-kanban').style.display='none';
  await loadWeek(currentWeekStart);
  document.getElementById('loading').style.display='none';
  document.getElementById('view-kanban').style.display='block';
  renderKanban();
}

function renderKanban(){
  const todayStr=dateKey(new Date());
  const ws=currentWeekStart,we=addDays(ws,6);
  document.getElementById('week-label').textContent=
    ws.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' – '+
    we.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
  const grid=document.getElementById('days-grid');grid.innerHTML='';
  const isAdmin=currentUser.role==='admin';
  const today0=new Date();today0.setHours(0,0,0,0);

  for(let i=0;i<7;i++){
    const day=addDays(ws,i);const key=dateKey(day);
    if(day<PROJECT_START)continue;
    const isToday=key===todayStr;
    const isPast=day<today0;
    const hist=HISTORY[key];
    const d=getDay(key);
    const tomorrow=addDays(today0,1);
    const schedAlert=isAdmin&&key===dateKey(tomorrow)&&!PLATFORMS.every(p=>d.platforms&&d.platforms[p]==='done');
    const complete=isDayComplete(key);
    const linksOk=hasLinks(key);

    const card=document.createElement('div');
    card.className='day-card'+(isToday?' today':'')+(schedAlert?' sched-alert-card':'');

    let dotHTML='';
    if(hist){
      if(hist.status==='ok')dotHTML='<span class="sdot sdot-g"></span>';
      else if(hist.status==='fail')dotHTML='<span class="sdot sdot-r"></span>';
      else if(hist.status==='partial')dotHTML='<span class="sdot sdot-o"></span>';
    }else if(isPast&&!isToday){dotHTML='<span class="sdot sdot-gray"></span>';}

    let histBar='';
    if(hist&&hist.status==='fail')histBar=`<div class="hist-bar hb-fail"><i class="ti ti-x"></i>${hist.note}</div>`;
    else if(hist&&hist.status==='partial')histBar=`<div class="hist-bar hb-partial"><i class="ti ti-alert-triangle"></i>${hist.note}</div>`;
    else if(hist&&hist.status==='ok')histBar=`<div class="hist-bar hb-ok"><i class="ti ti-check"></i>Postagens realizadas</div>`;

    const platBtns=PLATFORMS.map(p=>{
      const done=d.platforms&&d.platforms[p]==='done';
      const locked=isAdmin&&!linksOk;
      return `<button class="plat-btn${done?' done':''}" onclick="togglePlat('${key}','${p}')" ${(!isAdmin||locked)?'disabled':''}>
        <i class="ti ${PLAT_ICONS[p]}"></i>${p}${done?' <i class="ti ti-check"></i>':''}
      </button>`;
    }).join('');

    const longOpen=d.long_link?`<button class="open-btn" onclick="window.open('${d.long_link}','_blank')"><i class="ti ti-external-link"></i></button>`:'';
    const viralOpen=d.viral_link?`<button class="open-btn" onclick="window.open('${d.viral_link}','_blank')"><i class="ti ti-external-link"></i></button>`:'';

    const longObs=isAdmin
      ?`<textarea class="obs-area" placeholder="Observações para o Rudney..." oninput="saveField('${key}','long_obs',this.value)">${d.long_obs||''}</textarea>`
      :(d.long_obs?`<div class="obs-notify"><i class="ti ti-bell"></i>${d.long_obs}</div>`:'');
    const viralObs=isAdmin
      ?`<textarea class="obs-area" placeholder="Observações para o Teixeira..." oninput="saveField('${key}','viral_obs',this.value)">${d.viral_obs||''}</textarea>`
      :(d.viral_obs?`<div class="obs-notify"><i class="ti ti-bell"></i>${d.viral_obs}</div>`:'');

    card.innerHTML=`
      <div class="day-header">
        <div class="day-title">${cap(fmtDate(day))}</div>
        <div class="day-badges">${isToday?'<span class="badge-today">hoje</span>':''}${dotHTML}</div>
      </div>
      <div class="day-body">
        ${histBar}
        <div class="editor-block">
          <div class="editor-label"><i class="ti ti-video"></i>Rudney — vídeos longos</div>
          <div class="link-row">
            <input class="link-input" type="text" placeholder="Cole o link do Drive aqui..." value="${d.long_link||''}" oninput="saveField('${key}','long_link',this.value)"/>
            ${longOpen}
          </div>${longObs}
        </div>
        <div class="editor-block">
          <div class="editor-label"><i class="ti ti-scissors"></i>Teixeira — cortes virais</div>
          <div class="link-row">
            <input class="link-input" type="text" placeholder="Cole o link do Drive aqui..." value="${d.viral_link||''}" oninput="saveField('${key}','viral_link',this.value)"/>
            ${viralOpen}
          </div>${viralObs}
        </div>
        <div class="post-section">
          <div class="post-label${!linksOk&&isAdmin?' warn':''}">
            ${!linksOk&&isAdmin?'<i class="ti ti-lock" style="font-size:11px;"></i> Adicione os links para liberar':'Postagens agendadas'}
          </div>
          <div class="plat-row">${platBtns}</div>
        </div>
        ${complete?'<div class="complete-strip"><i class="ti ti-circle-check"></i>Dia completo — links + postagens ok</div>':''}
        ${schedAlert?'<div class="sched-strip"><i class="ti ti-alert-triangle"></i>Agendar postagens de amanhã!</div>':''}
      </div>`;
    grid.appendChild(card);
  }
}

window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('login-screen').style.display='flex';
});
</script>
</body>
</html>
